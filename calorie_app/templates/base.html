<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}CaloriePulse{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body
    class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans"
  >
    <!-- Separate Navbar File Included -->
    {% include 'navbar.html' %}

    <!-- Main Content Area -->
    <main class="container mx-auto px-4 py-8 flex-grow">
      {% block content %}
      <!--  -->

      <!--  -->
      {% endblock content %}
    </main>

    <!-- Separate Footer File Included -->
    {% include 'footer.html' %}
  </body>
</html>
