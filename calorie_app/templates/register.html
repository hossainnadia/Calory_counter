{% extends 'base.html' %}
<!--  -->
{% block title %}Register - CaloriePulse{% endblock title %}
<!--  -->
{% block content %}
<div class="max-w-md mx-auto my-8">
  <div
    class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-8 shadow-2xl backdrop-blur-sm"
  >
    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-white">Create Account</h2>
      <p class="text-slate-400 text-sm mt-1">
        Join CaloriePulse to track your health
      </p>
    </div>

    {% if error %}
    <div
      class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs p-3 rounded-xl mb-4 text-center"
    >
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-slate-300 text-sm font-medium mb-1"
          >Username</label
        >
        <input
          type="text"
          name="username"
          required
          class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition-colors"
        />
      </div>

      <div>
        <label class="block text-slate-300 text-sm font-medium mb-1"
          >Email</label
        >
        <input
          type="email"
          name="email"
          required
          class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition-colors"
        />
      </div>

      <div>
        <label class="block text-slate-300 text-sm font-medium mb-1"
          >Password</label
        >
        <input
          type="password"
          name="password"
          required
          class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition-colors"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-600/30 transition-all mt-4"
      >
        Register
      </button>
    </form>

    <p class="text-slate-400 text-sm text-center mt-6">
      Already have an account?
      <a
        href="{% url 'login' %}"
        class="text-cyan-400 hover:underline font-medium"
        >Login here</a
      >
    </p>
  </div>
</div>
{% endblock content %}
