<nav
  class="bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/80 sticky top-0 z-50 py-3.5 shadow-2xl"
>
  <div class="container mx-auto px-4 flex items-center justify-between gap-4">
    <!-- Brand Logo -->
    <a
      href="{% url 'home' %}"
      class="flex items-center gap-2.5 text-xl font-extrabold tracking-tight group"
    >
      <div
        class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-red-500 flex items-center justify-center shadow-lg shadow-amber-500/20 group-hover:scale-105 transition-transform"
      >
        <i class="fa-solid fa-fire text-white text-lg"></i>
      </div>
      <span
        class="bg-gradient-to-r from-cyan-400 via-sky-400 to-blue-500 bg-clip-text text-transparent"
        >CaloriePulse</span
      >
    </a>

    <!-- Middle Search Bar -->
    <div class="hidden md:flex flex-1 max-w-md mx-6">
      <form action="{% url 'home' %}" method="GET" class="w-full relative">
        <input
          type="text"
          name="q"
          placeholder="Search food, recipes, calories..."
          class="w-full bg-slate-900/90 text-slate-200 placeholder-slate-500 text-sm rounded-full pl-11 pr-4 py-2 border border-slate-700/60 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all shadow-inner"
        />
        <div
          class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500"
        >
          <i class="fa-solid fa-magnifying-glass text-xs"></i>
        </div>
      </form>
    </div>

    <!-- Navigation Links & Auth Actions -->
    <div class="flex items-center gap-6">
      <div class="hidden lg:flex items-center gap-6 text-sm font-medium">
        <a
          href="{% url 'home' %}"
          class="text-slate-300 hover:text-cyan-400 transition-colors flex items-center gap-2"
        >
          <i class="fa-solid fa-house text-slate-400 text-xs"></i> Home
        </a>
        <a
          href="{% url 'about' %}"
          class="text-slate-300 hover:text-cyan-400 transition-colors flex items-center gap-2"
        >
          <i class="fa-solid fa-circle-info text-slate-400 text-xs"></i> About
        </a>
      </div>

      <div class="hidden lg:block w-px h-5 bg-slate-800"></div>

      <!-- Login / Logout Condition Logic -->
      <div class="flex items-center gap-3">
        {% if user.is_authenticated %}
        <!-- If User is Logged In: Show Dashboard & Logout -->
        <a
          href="{% url 'dashboard' %}"
          class="text-slate-300 hover:text-cyan-400 font-medium text-sm transition-colors flex items-center gap-2"
        >
          <i class="fa-solid fa-gauge text-cyan-400 text-xs"></i> Dashboard
        </a>
        <div
          class="flex items-center gap-2 bg-slate-900/80 border border-slate-800 rounded-full py-1 pl-3 pr-1.5"
        >
          <span class="text-slate-300 text-xs font-semibold">
            <i class="fa-solid fa-circle text-emerald-500 text-[8px] me-1"></i>
            {{ user.username }}
          </span>
          <a
            href="{% url 'logout' %}"
            class="px-3 py-1 text-xs font-semibold text-rose-400 hover:bg-rose-500/10 rounded-full transition-all border border-rose-500/20"
          >
            Logout
          </a>
        </div>
        {% else %}
        <!-- If User is Logged Out: Show Login & Register -->
        <a
          href="{% url 'login' %}"
          class="px-4 py-2 text-sm font-medium text-slate-300 hover:text-white transition-colors"
        >
          Login
        </a>
        <a
          href="{% url 'register' %}"
          class="px-5 py-2 text-sm font-semibold text-white bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 rounded-full shadow-lg shadow-blue-600/25 hover:shadow-cyan-500/35 transition-all transform hover:-translate-y-0.5"
        >
          Get Started
        </a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
